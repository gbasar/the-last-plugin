# work-safety enforcement. The text is ../session-start.d/00-work-safety.md;
# these rules catch what Claude Code's permissions (../claude-settings.json)
# can't express. `lplug off @work` turns them off on a home machine.

[curl-pipe-shell]
event = tool_before
tool  = ^Bash$
when  = (curl|wget)\b[^;]*\|\s*(sudo\s+)?(ba|z|da)?sh\b
block = work-safety: no piping downloads into a shell. Use the download hierarchy.
tags  = work, safety

[security-software]
event = tool_before
tool  = ^Bash$
when  = (?i)((systemctl|service)\s+(stop|disable|mask)\s+\S*(falcon|crowdstrike|sentinel|defender|mdatp|clamav|auditd|firewalld|osquery|wazuh)|setenforce\s+0|Set-MpPreference|auditctl\s+-D)
block = work-safety: never touch security software. Stop and tell the user.
tags  = work, safety

[registry-edit]
event = tool_before
tool  = ^Bash$
when  = (?i)(\breg(\.exe)?\s+(add|delete|import)|regedit|(Set|New)-ItemProperty\s.*HK(LM|CU))
block = work-safety: no registry edits.
tags  = work, safety

[network-scan]
event   = tool_before
tool    = ^Bash$
when    = \b(nmap|masscan|zmap|rustscan)\b|\bnc\s+-\w*z
confirm = work-safety: port/network scan. Only with a reason the user approved.
tags    = work, safety
