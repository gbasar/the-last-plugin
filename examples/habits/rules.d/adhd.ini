# adhd-simple: ADHD-friendly replies, and staying on track.
# `lplug off @adhd` turns all of it off; `lplug off adhd-nudge` turns off one.
# The rules text lives in ../skills.d/adhd-simple/RULES.md.

[adhd]
description = ADHD-friendly replies; detours allowed, always come back
event = session_start, subagent_start
file  = ~/.config/lplug/skills.d/adhd-simple/RULES.md
tags  = adhd

# The user wanders off: let them, but mark the place to come back to.
[adhd-detour]
event = prompt_submit
when  = (?i)(\b(btw|by the way|unrelated|side ?(note|question)|quick question|while (we're|you're|i'm) at it|random(ly)?|off.?topic|before i forget)\b|^(oh|also|wait)\b)
text  = adhd: possible detour. Fine to follow it: open with "Detour from: <main task> (step N of M)." and end with "Back to: <main task>. Next: <step>."
tags  = adhd

# Every so often, surface the main task even if nobody said "btw".
[adhd-nudge]
event = prompt_submit
every = 6
text  = adhd: is the main task still open? Start the reply with "On: <main task> (step N of M)." If this prompt is a detour, follow the detour rules.
tags  = adhd

# A detour reply that forgot the way back gets sent back to add it.
[adhd-return]
event  = stop
when   = Detour from:
unless = Back to:|Nothing open
text   = adhd: you took a detour but didn't come back. End with one line: "Back to: <main task>. Next: <step>."
tags   = adhd

# Wrapping up: list what's still open so nothing is quietly dropped.
[adhd-finish]
event  = stop
when   = (?i)\b(done|finished|all set|complete[d]?|that's it|wrapped up|ready to (ship|merge))\b
unless = Still open:|Nothing open
text   = adhd: before you stop, end with "Still open:" (main task if unfinished, parked items, at most 5), or "Nothing open."
tags   = adhd

# Keep the main task and the parked list through context compaction.
[adhd-compact]
event = compact_before
text  = adhd: keep in the summary, word for word: the main task and its step, every detour still open, and the parked list.
tags  = adhd
