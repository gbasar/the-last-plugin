# kanban: work from a Markdown kanban board, kept current by these hooks.
# `lplug off @kanban` turns all of it off; `lplug off kanban-prompt` turns off one.
# The script and its rules: ../skills.d/kanban/ (README.md there).
# Each hook prints nothing in projects without a board, so they cost nothing there.

[kanban]
description = Kanban board: rules and board at session start
event = session_start
run   = ~/.config/lplug/skills.d/kanban/kanban hook-start
tags  = kanban

# Board changed outside the chat (Obsidian, editor, terminal), or new cards in In.
[kanban-prompt]
event = prompt_submit
run   = ~/.config/lplug/skills.d/kanban/kanban hook-prompt
tags  = kanban

# Remember that files changed, so the stop check knows the board may be behind.
[kanban-tool]
event = tool_after
tool  = ^(Edit|Write|MultiEdit|NotebookEdit)$
run   = ~/.config/lplug/skills.d/kanban/kanban hook-tool
tags  = kanban

# Files changed but the board didn't: send the agent back once to update it.
[kanban-stop]
event = stop
run   = ~/.config/lplug/skills.d/kanban/kanban hook-stop
tags  = kanban
