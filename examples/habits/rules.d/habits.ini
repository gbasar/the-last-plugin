# Habits: how the agent works. `lplug off @habits` turns them all off;
# `lplug off <id>` turns off one. Texts live in ../text/.

# ---- clear-scripter: readable commands and helper scripts
[clear-scripter]
description = Readable commands and helper scripts
event = session_start, subagent_start
file  = clear-scripter.md
tags  = habits, style

[clear-scripter-nudge]
event = tool_before
tool  = ^Bash$
every = 20
text  = clear-scripter: one step per command, knobs up top, long flags, labelled output.
tags  = habits, style

[prefs]
description = Shell and tool preferences
event = session_start, subagent_start
file  = prefs.md
tags  = habits, style

# ---- group-think: learn from docs and people, not source code
[group-think]
description = Learn from docs and people, not source code
event = session_start
file  = group-think.md
tags  = habits

[group-think-prompt]
event = prompt_submit
when  = (?i)\b(install|set ?up|configure|upgrade|migrat|error|not working|how do i)
text  = group-think: read the docs and what others report before digging into code.
tags  = habits

[group-think-install]
event = tool_before
tool  = ^Bash$
when  = \b(pip|pipx|uv|npm|pnpm|yarn|brew|apt(-get)?|cargo|gem)\s+(install|add)\b
text  = group-think: is this the install method the project's docs recommend?
tags  = habits

# ---- good-listener: wait until the user is done; don't snoop
[good-listener]
description = Wait until the user is done; don't snoop
event = session_start
file  = good-listener.md
tags  = habits

[good-listener-turn]
event = prompt_submit
text  = good-listener: is the user done giving directions? Read only what they pointed you to.
tags  = habits

[good-listener-hold]
event = prompt_submit
when  = (?i)\b(wait|hold on|one sec|more coming|not done|let me finish)\b
text  = The user isn't finished. Acknowledge in one line and wait: no code, design, searching or subagents.
tags  = habits

# ---- knowledge bases (map: ../knowledge-bases.ini)
[knowledge-bases]
description = Check my knowledge bases before googling
event = session_start, subagent_start
file  = knowledge-bases.md
run   = lplug kb render
tags  = habits, kb

# ---- time-maximizer: do it myself; one script to diagnose, one to fix
[time-maximizer]
description = Do it myself; one script to diagnose, one to fix
event = session_start
file  = time-maximizer.md
tags  = habits

[time-maximizer-trouble]
event = prompt_submit
when  = (?i)\b(error|fail(s|ed|ing)?|broken|not working|doesn'?t work|crash|stuck)\b
text  = time-maximizer: fix it yourself if you can; otherwise one diagnostic script that checks every likely cause at once.
tags  = habits

[time-maximizer-handback]
event = stop
when  = (?i)\b(run (this|these|the following)|can you (run|try|check)|let me know (what|the output))\b
text  = time-maximizer: before handing this back, could you do it yourself, or fold it into one script?
tags  = habits

# ---- dollar-maxing: spend only when the request calls for it
[dollar-maxing]
description = Spend only when the request calls for it; cheap subagents
event = session_start
file  = dollar-maxing.md
tags  = habits

[subagent-model]
event  = tool_before
tool   = ^Agent$
unless = '"model"\s*:|"subagent_type"\s*:\s*"fork"'
block  = dollar-maxing: set the subagent's model explicitly (haiku / sonnet / opus), the cheapest that can do the job.
tags   = habits

# ---- heavy-scripter: reuse or write reusable scripts
[heavy-scripter]
description = Reuse or write reusable scripts
event = session_start, subagent_start
file  = heavy-scripter.md
tags  = habits
