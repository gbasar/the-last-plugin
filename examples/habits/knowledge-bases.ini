# Knowledge bases (lplug help kb). Rename, replace and add your own.
# A project can override any of this in <repo>/.config/lplug/knowledge-bases.ini.

[defaults]
edits         = suggest
preload       = outline
preload_limit = 4000

[greg-personal]
description = Personal notes: preferences, people, past decisions
path        = ~/kb/greg-personal

[agents-collecting]
description = What we've learned about agents, tools and prompting
path        = ~/kb/agents-collecting

[project-blackbird]
description = Project Blackbird: architecture, decisions, glossary
path        = ~/work/blackbird/wiki
only_in     = ~/work/blackbird
edits       = none
aliases     = blackbird

# heavy-scripter's personal script library
[scripts]
description = Reusable helper scripts, mine and agents'
path        = ~/.local/share/scripts
kind        = scripts
edits       = apply
preload     = full
